<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4A5D4E" />
  <title>Offline — AUREA</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F5F0EB;
      color: #2A2A2A;
      font-family: Georgia, 'Times New Roman', serif;
      text-align: center;
      padding: 24px;
    }
    .brand {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      color: #4A5D4E;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 400;
      margin-bottom: 16px;
      color: #2A2A2A;
    }
    p {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.95rem;
      line-height: 1.8;
      color: rgba(42, 42, 42, 0.7);
      max-width: 420px;
    }
    .phone {
      display: inline-block;
      margin-top: 32px;
      color: #C5A572;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 1.1rem;
      text-decoration: none;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: #C5A572;
      margin: 24px auto;
    }
  </style>
</head>
<body>
  <div class="brand">AUREA</div>
  <h1>You're Currently Offline</h1>
  <div class="divider"></div>
  <p>It looks like you've lost your internet connection. Please check your connection and try again.</p>
  <a href="tel:02079460321" class="phone">020 7946 0321</a>
</body>
</html>
